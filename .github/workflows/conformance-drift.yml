name: Conformance drift

# The four official clients carry identical copies of conformance/. Warn when
# another repository's manifest differs from this one, and when the SDK and
# plugin pages bundled in knowledge/upstream/ are behind their repositories.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare MANIFEST.sha256 with the other clients
        run: |
          status=0
          for repo in bakbak-python bakbak-js livekit-plugins-bakbak; do
            url="https://raw.githubusercontent.com/raya-voice-ai/$repo/main/conformance/MANIFEST.sha256"
            if ! curl -fsSL "$url" -o "other.sha256"; then
              echo "::warning::Could not fetch $url"
              continue
            fi
            if ! diff -u conformance/MANIFEST.sha256 other.sha256; then
              echo "::warning::conformance/ differs from raya-voice-ai/$repo"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Re-sync conformance/ from the canonical copy (see CONTRIBUTING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compare knowledge/upstream with the SDK and plugin repositories
        run: |
          if ! node scripts/sync-knowledge.mjs --remote --check; then
            echo "::warning::knowledge/upstream is behind the SDK or plugin repositories"
            echo "Run npm run knowledge:sync and commit the result (see knowledge/README.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
