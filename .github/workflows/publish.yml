name: Publish

# release-please creates releases with GITHUB_TOKEN, and events made with that token start no
# workflows, except workflow_dispatch. So release-please.yml dispatches this workflow on the new
# release's tag; publishing a release by hand also triggers it. npm's trusted publisher names
# this file, so publishing must stay here. Both triggers run on the tag, so the tag (not the
# release event) says what is published.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm (trusted publishing, with provenance)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse to publish a local SDK link
        run: |
          spec=$(node -p "require('./package.json').dependencies.bakbak")
          case "$spec" in file:*) echo "::error::package.json still depends on $spec; switch to the published SDK (see CONTRIBUTING.md)"; exit 1;; esac
      - uses: ./.github/actions/setup
      - run: npm test
      - run: npm run build
      - name: Publish (prereleases under the "next" tag)
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"; exit 1; }
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

  mcpb:
    name: Claude Desktop bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run bundle:mcpb
      - run: gh release upload "$GITHUB_REF_NAME" bakbak-mcp-*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned by checksum)
        run: |
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$file"
          echo "${MCP_PUBLISHER_SHA256}  $file" | sha256sum -c -
          tar xzf "$file" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
