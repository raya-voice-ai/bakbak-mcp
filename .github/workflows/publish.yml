name: Publish

# release-please creates releases with GITHUB_TOKEN, and events made with that token start no
# workflows, except workflow_dispatch. So release-please.yml dispatches this workflow on the new
# release's tag; publishing a release by hand also triggers it. npm's trusted publisher names
# this file, so publishing must stay here. Both triggers run on the tag, so the tag (not the
# release event) says what is published.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm (trusted publishing, with provenance)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The npm environment waits for the maintainer's approval and only accepts v* tags. The
    # other jobs need this one, so one approval releases everything.
    environment:
      name: npm
      url: https://www.npmjs.com/package/bakbak-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Releases come only from main: refuse a v* tag on a commit main does not contain.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Refuse to publish a local SDK link
        run: |
          spec=$(node -p "require('./package.json').dependencies.bakbak")
          case "$spec" in file:*) echo "::error::package.json still depends on $spec; switch to the published SDK (see CONTRIBUTING.md)"; exit 1;; esac
      - uses: ./.github/actions/setup
      - run: npm test
      - run: npm run build
      - name: Publish (prereleases under the "next" tag)
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"; exit 1; }
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

  mcpb:
    name: Claude Desktop bundle
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run bundle:mcpb
      - run: gh release upload "$GITHUB_REF_NAME" bakbak-mcp-*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned by checksum)
        run: |
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$file"
          echo "${MCP_PUBLISHER_SHA256}  $file" | sha256sum -c -
          tar xzf "$file" mcp-publisher
      # npm can take a few minutes to serve a version it has just accepted, and the registry
      # refuses a server whose npm version it cannot see yet. Wait for npm, then retry briefly.
      - name: Wait for npm to serve this version
        run: |
          url="https://registry.npmjs.org/bakbak-mcp/${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null -H 'Cache-Control: no-cache' "$url" && exit 0
            sleep 10
          done
          echo "::error::npm did not serve $url within 5 minutes"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
          exit 1
